<!-- templates/criar_pedido.html -->
<h2>Criar Pedido</h2>
<form method="POST">
    <label>Status:</label><input name="status" required><br>
    <label>Delivery (True/False):</label><input name="delivery" required><br>
    <label>Endereço:</label><input name="endereco"><br>
    <label>Data:</label><input name="date" required><br>
    <label>Valor Total:</label><input name="valor_total" required><br>
    <button type="submit">Criar Pedido</button>
</form>
